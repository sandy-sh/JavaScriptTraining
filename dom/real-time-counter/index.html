<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="counter-card">
        <p class="eyebrow">Writing helper</p>
        <h1>Real Time Character Counter</h1>
        <p class="description">Your text is trimmed automatically once it reaches the 50-character limit.</p>
        <textarea id="text-input" placeholder="Type something..."></textarea>
        <p id="char-count" class="counter-text">Character Count: 0/50</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
